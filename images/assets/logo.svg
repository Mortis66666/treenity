<svg width="560" height="560" viewBox="0 0 560 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Treenity icon</title>
<desc>A circular icon showing a tree at the center surrounded by three interlocking petal shapes representing CO2 at top left, the sun at top right, and water at the bottom, arranged like a trinity symbol.</desc>

<circle cx="280" cy="280" r="250" fill="#F5F1E8" stroke="#2E7D32" stroke-width="4"/>

<g transform="translate(280,280)">
  <!-- CO2 petal, top-left -->
  <g opacity="0.85" transform="rotate(-60)">
    <path d="M0,0 C-55,-70 -55,-150 0,-195 C55,-150 55,-70 0,0 Z" fill="#90A4AE"/>
  </g>
  <!-- Sun petal, top-right -->
  <g opacity="0.85" transform="rotate(60)">
    <path d="M0,0 C-55,-70 -55,-150 0,-195 C55,-150 55,-70 0,0 Z" fill="#FDB813"/>
  </g>
  <!-- Water petal, bottom -->
  <g opacity="0.85" transform="rotate(180)">
    <path d="M0,0 C-55,-70 -55,-150 0,-195 C55,-150 55,-70 0,0 Z" fill="#29B6F6"/>
  </g>

  <circle r="46" fill="#F5F1E8" stroke="#2E7D32" stroke-width="3"/>

  <!-- CO2 molecule icon, top-left tip -->
  <g transform="rotate(-60) translate(0,-202) rotate(60)">
    <circle cx="-20" cy="0" r="13" fill="#78909C"/>
    <circle cx="0" cy="0" r="16" fill="#455A64"/>
    <circle cx="20" cy="0" r="13" fill="#78909C"/>
  </g>

  <!-- Sun icon, top-right tip -->
  <g transform="rotate(60) translate(0,-202) rotate(-60)">
    <circle r="20" fill="#F7931E"/>
    <g stroke="#F7931E" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-30" x2="0" y2="-40"/>
      <line x1="21" y1="-21" x2="29" y2="-29"/>
      <line x1="-21" y1="-21" x2="-29" y2="-29"/>
      <line x1="30" y1="0" x2="40" y2="0"/>
      <line x1="-30" y1="0" x2="-40" y2="0"/>
    </g>
  </g>

  <!-- Water droplet icon, bottom tip -->
  <g transform="rotate(180) translate(0,-202) rotate(-180)">
    <path d="M0,-22 C13,-4 22,10 22,22 C22,35 12,44 0,44 C-12,44 -22,35 -22,22 C-22,10 -13,-4 0,-22 Z" fill="#0288D1"/>
  </g>

  <!-- tree at the very center -->
  <g transform="scale(2.75)">
    <path d="M-14,58 L-11,5 L-5,-13 L0,3 L5,-13 L11,5 L14,58 Z" fill="#6D4C41"/>
    <path d="M-23,58 Q-13,51 0,55 Q13,51 23,58 Q12,61 0,59 Q-12,61 -23,58 Z" fill="#5D4037"/>
    <circle cx="0" cy="-12" r="36" fill="#2E7D32"/>
    <circle cx="-24" cy="5" r="25" fill="#43A047"/>
    <circle cx="24" cy="5" r="25" fill="#43A047"/>
  </g>
</g>
</svg>
